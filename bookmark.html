<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bookmarks</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --glow: #1aff7a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #000;
      color: #eaeaf0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Animated heading */
    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeInMoveDown 1.2s ease forwards;
      text-align: center;
      font-weight: 800;
      letter-spacing: 1px;
      user-select: none;
    }

    @keyframes fadeInMoveDown {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Bookmark container */
    .bookmark-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(18px);
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease 0.3s forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bookmark-box ul {
      list-style: none;
    }

    .bookmark-box li {
      margin-bottom: 1.2rem;
    }

    .bookmark-box a {
      color: var(--glow);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .bookmark-box a:hover,
    .bookmark-box a:focus {
      color: #00cc7a;
      text-decoration: underline;
      text-shadow: 0 0 8px var(--glow);
      outline: none;
    }

    /* Back button */
    .back-button {
      align-self: flex-start;
      margin-bottom: 2rem;
      background: none;
      border: 2px solid var(--glow);
      color: var(--glow);
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: box-shadow 0.3s ease, filter 0.3s ease;
      user-select: none;
    }

    .back-button:hover,
    .back-button:focus {
      box-shadow: 0 0 12px var(--glow), 0 0 24px var(--glow);
      filter: brightness(1.3);
      outline: none;
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="history.back()" aria-label="Go back to home">← Back</button>

  <h1>Bookmarks</h1>

  <div class="bookmark-box" role="region" aria-label="List of bookmarks">
    <ul>
      <li><a href="https://docs.google.com/document/d/1HxOlWG4Txe6yZbflb4dupC0Vv07KsbMcerRKqa5sckE/edit?usp=sharing" target="_blank" rel="noopener">Bookmark Hub</a></li>
      <li><a href="https://ubghub.org" target="_blank" rel="noopener">UBGHub</a></li>
      <!-- Add more bookmarks here -->
    </ul>
  </div>
</body>
</html>
