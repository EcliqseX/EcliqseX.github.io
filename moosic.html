<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --glow: #1aff7a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #000;
      color: #eaeaf0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-align: center;
    }

    .music-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      max-width: 700px;
      margin-bottom: 50px;
    }

    iframe {
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 700px;
      height: 380px;
      transition: all 0.3s ease;
    }

    .random-button {
      background: none;
      border: 2px solid var(--glow);
      color: var(--glow);
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      cursor: pointer;
      transition: box-shadow 0.3s ease, filter 0.3s ease;
      margin-top: 1rem;
    }

    .random-button:hover {
      box-shadow: 0 0 12px var(--glow), 0 0 24px var(--glow);
      filter: brightness(1.3);
    }

    .back-button {
      align-self: flex-start;
      margin-bottom: 2rem;
      background: none;
      border: 2px solid var(--glow);
      color: var(--glow);
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: box-shadow 0.3s ease, filter 0.3s ease;
      user-select: none;
    }

    .back-button:hover {
      box-shadow: 0 0 12px var(--glow), 0 0 24px var(--glow);
      filter: brightness(1.3);
    }
  </style>
</head>
<body>

  <button class="back-button" onclick="history.back()">← Back</button>

  <h1>My Music</h1>

  <div class="music-container">
    <!-- Spotify Embed -->
    <iframe id="spotifyEmbed" 
      src="https://open.spotify.com/embed/playlist/3dwRKuWhiYAlCNX7yz9CZB?utm_source=generator&theme=0" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
      loading="lazy"></iframe>

    <!-- Cycle Button -->
    <button class="random-button" onclick="cyclePlaylist()">Next Playlist</button>
  </div>

  <script>
    const playlists = [
      "https://open.spotify.com/embed/playlist/3dwRKuWhiYAlCNX7yz9CZB?utm_source=generator&theme=0",
      "https://open.spotify.com/embed/playlist/57cfbNaebbmX21ha5cI5Fk?utm_source=generator&theme=0",
      "https://open.spotify.com/embed/playlist/4LBlOmxZ96BPJ2FrjbNkfc?utm_source=generator&theme=0"
    ];

    let currentIndex = 0;

    function cyclePlaylist() {
      currentIndex++;
      if(currentIndex >= playlists.length) currentIndex = 0;
      document.getElementById("spotifyEmbed").src = playlists[currentIndex];
    }
  </script>
</body>
</html>
