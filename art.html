<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Artworks</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --glow: #1aff7a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #000;
      color: #eaeaf0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    h1 {
      font-size: 2.5rem;
      margin-top: 50px;
      margin-bottom: 30px;
      letter-spacing: 2px;
      font-weight: 800;
    }

    /* ===== CAROUSEL ===== */
    .carousel-container {
      width: 80%;
      max-width: 1000px;
      position: relative;
      display: flex;
      overflow: hidden;
      border-radius: 22px;
      backdrop-filter: blur(18px);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      margin-bottom: 50px;
    }

    .carousel {
      display: flex;
      transition: transform 0.5s ease;
      width: 100%;
    }

    .carousel-item {
      min-width: 100%;
      position: relative;
    }

    .carousel img {
      width: 100%;
      border-radius: 18px;
      display: block;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .carousel img:hover {
      transform: scale(1.03);
      box-shadow:
        0 0 14px rgba(26,255,122,0.45),
        0 0 32px rgba(26,255,122,0.25);
    }

    .caption {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: #fff;
      font-size: 1.1rem;
      background-color: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 8px;
      pointer-events: none;
    }

    /* ===== NAV BUTTONS ===== */
    .nav-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.3);
      color: var(--glow);
      font-size: 2rem;
      border: none;
      padding: 10px;
      cursor: pointer;
      z-index: 10;
      border-radius: 50%;
      transition: background-color 0.3s;
      user-select: none;
    }

    .nav-button:hover {
      background-color: rgba(0,0,0,0.6);
    }

    .prev { left: 10px; }
    .next { right: 10px; }

    /* ===== BACK BUTTON ===== */
    .back-button {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 0.9rem;
      color: #ccc;
      text-decoration: none;
      border: 1px solid #555;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background 0.3s;
    }

    .back-button:hover {
      background-color: #222;
    }

    /* ===== PARTICLES (OPTIONAL) ===== */
    .particle {
      position: absolute;
      top: -50px;
      font-size: 12px;
      opacity: 0.1;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity:0.1; }
      100% { transform: translateY(120vh) rotate(360deg); opacity:0.1; }
    }
  </style>
</head>
<body>
  <h1>My Artworks 🎨</h1>

  <div class="carousel-container">
    <button class="nav-button prev" onclick="moveCarousel(-1)">&#10094;</button>
    <div class="carousel" id="carousel">
      <!-- Add your artwork images here -->
      <div class="carousel-item">
        <img src="images/art01.jpg" alt="Artwork 1">
        <div class="caption">BeaBaDobEE smth</div>
      </div>
      <div class="carousel-item">
        <img src="images/art02.jpg" alt="Artwork 2">
        <div class="caption">30 min sketch on ibis :o</div>
      </div>
      <div class="carousel-item">
        <img src="images/art3.png" alt="Artwork 3">
        <div class="caption">Artwork 3</div>
      </div>
    </div>
    <button class="nav-button next" onclick="moveCarousel(1)">&#10095;</button>
  </div>

  <a href="index.html" class="back-button">← go back</a>

  <script>
    let currentIndex = 0;

    function moveCarousel(direction) {
      const carousel = document.getElementById('carousel');
      const items = document.querySelectorAll('.carousel-item');
      const totalItems = items.length;

      currentIndex += direction;

      if (currentIndex < 0) currentIndex = totalItems - 1;
      else if (currentIndex >= totalItems) currentIndex = 0;

      carousel.style.transform = `translateX(${-currentIndex * 100}%)`;
    }

    // Optional particles for flair
    const particleIcons = ["✨","🎨","💫"];
    for(let i=0;i<20;i++){
      const p = document.createElement('div');
      p.className='particle';
      p.style.left = Math.random()*100 + 'vw';
      p.style.animationDuration = (5+Math.random()*7)+'s';
      p.textContent = particleIcons[Math.floor(Math.random()*particleIcons.length)];
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
